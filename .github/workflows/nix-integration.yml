name: Real Nix integration

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: nix-cache-testing
  cancel-in-progress: true

jobs:
  nix-cache-e2e:
    name: Deploy and verify the testing cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NIX_CACHE_TESTING_URL: ${{ secrets.NIX_CACHE_TESTING_URL }}
      NIX_CACHE_TESTING_READ_TOKEN: ${{ secrets.NIX_CACHE_TESTING_READ_TOKEN }}
      READ_TOKEN: ${{ secrets.NIX_CACHE_TESTING_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.NIX_CACHE_TESTING_WRITE_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.NIX_CACHE_TESTING_ADMIN_TOKEN }}
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      NIX_CACHE_TESTING_WRITE_TOKEN: ${{ secrets.NIX_CACHE_TESTING_WRITE_TOKEN }}
      NIX_CACHE_TESTING_ADMIN_TOKEN: ${{ secrets.NIX_CACHE_TESTING_ADMIN_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command

      - name: Check required configuration
        run: |
          set -euo pipefail
          for variable_name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NIX_CACHE_TESTING_URL READ_TOKEN WRITE_TOKEN ADMIN_TOKEN R2_S3_ACCESS_KEY_ID R2_S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!variable_name:-}" ]]; then
              printf '%s must be configured as a GitHub repository secret\n' "$variable_name" >&2
              exit 1
            fi
          done

      - name: Render the isolated testing configuration
        run: |
          set -euo pipefail
          npx wrangler r2 bucket info nix-cache-testing > /dev/null
          export D1_DATABASE_ID
          D1_DATABASE_ID="$(npx wrangler d1 list --json | jq --exit-status --raw-output '[.[] | select(.name == "nix-cache-testing") | (.uuid // .database_id // .id)][0] // empty')"
          if [[ -z "$D1_DATABASE_ID" ]]; then
            printf 'D1 database nix-cache-testing was not found\n' >&2
            exit 1
          fi
          node scripts/ci/render-integration-wrangler-config.mjs

      - name: Reset isolated R2 and D1 state
        run: |
          set -euo pipefail
          aws s3 rm s3://nix-cache-testing --recursive --only-show-errors \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          npx wrangler d1 execute nix-cache-testing --remote --config wrangler.integration.generated.jsonc --command "PRAGMA foreign_keys=OFF; DROP TABLE IF EXISTS artifact_version_pending_members; DROP TABLE IF EXISTS artifact_version_members; DROP TABLE IF EXISTS narinfo_refs; DROP TABLE IF EXISTS job_object_items; DROP TABLE IF EXISTS gc_scan_versions; DROP TABLE IF EXISTS gc_policy_matches; DROP TABLE IF EXISTS gc_policy_capacity_matches; DROP TABLE IF EXISTS delete_job_nars; DROP TABLE IF EXISTS delete_job_narinfos; DROP TABLE IF EXISTS upload_sessions; DROP TABLE IF EXISTS write_claims; DROP TABLE IF EXISTS jobs; DROP TABLE IF EXISTS artifact_versions; DROP TABLE IF EXISTS artifact_packages; DROP TABLE IF EXISTS objects; DROP TABLE IF EXISTS gc_policies; DROP TABLE IF EXISTS settings; DROP TABLE IF EXISTS audit_log; DROP TABLE IF EXISTS d1_migrations;" \
            >/dev/null

      - name: Apply testing D1 migrations
        run: npx wrangler d1 migrations apply nix-cache-testing --remote --config wrangler.integration.generated.jsonc

      - name: Create or update the testing Worker
        run: npx wrangler deploy --config wrangler.integration.generated.jsonc

      - name: Set Worker Secrets from GitHub Secrets
        run: |
          set -euo pipefail
          for variable_name in READ_TOKEN WRITE_TOKEN ADMIN_TOKEN R2_S3_ACCESS_KEY_ID R2_S3_SECRET_ACCESS_KEY; do
            printf '%s' "${!variable_name}" | npx wrangler secret put "$variable_name" --config wrangler.integration.generated.jsonc
          done

      - name: Restore the complete testing deployment after secret rotation
        run: npx wrangler deploy --config wrangler.integration.generated.jsonc

      - name: Run the real Nix cache integration test
        run: bash scripts/integration/nix-cache-e2e.sh
